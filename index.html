    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #a81628;
            padding: 24px 16px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
        }
        .page-title {
            color: #ffffff;
            text-align: center;
            font-size: 26px;
            margin-bottom: 28px;
            font-weight: bold;
        }
        .row-three {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap:12px;
            margin-bottom:16px;
        }
        .row-two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap:12px;
            margin-bottom:16px;
        }
        .card-item {
            background:#ffffff;
            border-radius:12px;
            padding:20px 8px;
            text-align:center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .card-item a {
            text-decoration:none;
            color:#a81628;
            font-size:16px;
            font-weight:500;
        }
        .swiper-wrap{
            width:100%;
            border-radius:12px;
            overflow:hidden;
            position:relative;
            margin:24px 0;
        }
        .swiper-box{
            display:flex;
            transition: transform 0.5s ease;
        }
        .swiper-item{
            flex:0 0 100%;
            aspect-ratio: 900 / 383;
            overflow: hidden;
        }
        .swiper-item a{
            display:block;
            width:100%;
            height:100%;
        }
        .swiper-item a img{
            width:100%;
            height:100%;
            object-fit: cover;
            display:block;
        }
        .dots{
            position:absolute;
            bottom:10px;
            left:0;
            width:100%;
            display:flex;
            justify-content:center;
            gap:8px;
        }
        .dot{
            width:8px;
            height:8px;
            border-radius:50%;
            background:rgba(255,255,255,0.4);
        }
        .dot.active{
            background:#ffffff;
        }
        .module-wrap {
            background:#fff;
            border-radius:12px;
            padding:20px;
            margin-bottom:20px;
        }
        .module-title {
            font-size:18px;
            color:#a81628;
            margin-bottom:14px;
            font-weight:bold;
            border-left:4px solid #a81628;
            padding-left:10px;
        }
        .link-grid {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
        }
        .link-grid a {
            display:block;
            background:#f7f0f1;
            text-align:center;
            padding:14px;
            border-radius:8px;
            text-decoration:none;
            color:#333;
        }
    </style>

<script>
const swiperBox = document.getElementById('swiperBox');
const dotsBox = document.getElementById('dotsBox');
const itemList = document.querySelectorAll('.swiper-item');
const total = itemList.length;
let index = 0;

for(let i=0;i<total;i++){
    const d = document.createElement('span');
    d.className = 'dot' + (i===0?' active':'');
    dotsBox.appendChild(d);
}
const dotList = document.querySelectorAll('.dot');

function play(){
    index++;
    if(index >= total){
        index = 0;
    }
    swiperBox.style.transform = `translateX(-${index*100}%)`;
    dotList.forEach((d,i)=>{
        d.classList.toggle('active', i===index);
    })
}
setInterval(play,3000);
</script>
